[package]
name = "mdmin"
version = "0.2.0"
edition = "2024"
description = "Tree-sitter-based Markdown minifier for LLM token optimization"
license = "WTFPL"

[[bin]]
name = "mdmin"
path = "src/main.rs"

[[bin]]
name = "mdmin-bench"
path = "benches/benchmark.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
regex-lite = "0.1.9"
stop-words = "0.10.0"
tree-sitter = "0.26.11"
tree-sitter-markdown-fork = "0.7.3"
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
whatlang = "0.18.0"

[dev-dependencies]
tiktoken = "3.5.1"
